# Новая версия shiki приходит PR в tools/highlight, и CI этого PR собирает с ней скрипт
# подсветки кода и гоняет тесты.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/highlight
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
